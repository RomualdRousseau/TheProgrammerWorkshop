[project]
name = "taxi_driver_env"
version = "0.1.34"
description = "Taxi Driver Environment"
authors = [{ name = "Romuald Rousseau", email = "romuald.rousseau@servier.com" }]
requires-python = "~=3.11"
readme = "README.md"
dependencies = [
    "raylib>=5.0.0.2,<6",
    "numpy==2.0.0",
    "gymnasium>=0.29.1,<0.30",
    "tqdm>=4.66.4,<5",
    "numba>=0.60.0,<0.61",
    "scipy>=1.14.0,<2",
    "types-tqdm>=4.67.0.20250809",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "N",  # PEP8 naming convetions
    "D"   # pydocstyle
]
ignore = [
    "C901",  # Too complex
    "W191",  # Indentation contains tabs
    "D401",  # Imperative mood
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in `__init__`
    "E731"   # Lambda-assignment
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "src/taxi_driver_env/utils/*",
    "src/taxi_driver_env/render/*",
    "src/taxi_driver_env/game/*",
    "src/taxi_driver_env/math/linalg.py",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
