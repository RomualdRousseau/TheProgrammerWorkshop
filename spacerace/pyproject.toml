[project]
name = "spacerace"
version = "0.1.0"
description = "A modern adaptation of Space Race (Atari, 1973) built with raylib"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "raylib>=5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "ty>=0.0.1",
]

[project.scripts]
spacerace-play = "spacerace.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacerace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
