[project]
name = "permanence-env"
version = "0.1.0"
description = "A functional, modular game prototype built with Python and Raylib featuring Euler-integrated ball physics on an NxN grid"
readme = "README.md"
authors = [
    { name = "Romuald Rousseau", email = "romualdrousseau@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyray>=0.1.0",
    "pytmx>=3.32",
    "raylib>=5.5.0.4",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyclean>=3.6.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.9",
    "ty>=0.0.28",
]

