[project]
name = "racer"
version = "0.1.0"
description = "Monorepo for Racer project"
requires-python = "==3.11.*"
dependencies = [
    "fire>=0.7.1",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.31",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "prek>=0.0.10",
    "racer-env",
    "racer-agents",
]

[tool.uv]
managed = true
package = false

[tool.uv.workspace]
members = ["racer-env", "racer-agents"]

[tool.uv.sources]
racer-env = { workspace = true }
racer-agents = { workspace = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.coverage.run]
source = ["racer_env", "racer_agents"]
disable_warnings = ["module-not-imported"]
omit = [
    "*/ui/*",
    "*/__init__.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["racer-env/tests", "racer-agents/tests"]
pythonpath = ["racer-env/src", "racer-agents/src"]
addopts = "--cov"

[tool.ty.environment]
extra-paths = ["racer-env/src", "racer-agents/src"]
