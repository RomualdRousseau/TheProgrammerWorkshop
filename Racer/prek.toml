# prek configuration file

repos = [
    { repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v5.0.0", hooks = [
        { id = "trailing-whitespace" },
        { id = "end-of-file-fixer" },
        { id = "check-yaml" },
        { id = "check-added-large-files" },
        { id = "check-toml" },
    ]},
    { repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.9.0", hooks = [
        { id = "ruff", name = "Ruff Check" },
        { id = "ruff-format", name = "Ruff Format" },
    ]},
    { repo = "local", hooks = [
        { id = "ty-check", name = "Ty Check", entry = "uv run ty check", files = '\.py$', language = "system" },
    ]}
]
