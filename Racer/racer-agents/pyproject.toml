[project]
name = "racer-agents"
version = "0.1.0"
description = "Racer RL Agents"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "racer-env",
    "stable-baselines3>=2.3.0",
    "fire>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racer_agents"]

[tool.uv.sources]
racer-env = { workspace = true }
