[project]
name = "racer-env"
version = "0.1.0"
description = "Racer Gymnasium Environment"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "gymnasium>=1.0.0",
    "raylib>=5.0.0",
    "numpy>=1.26.0",
    "fire>=0.6.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/racer_env"]
